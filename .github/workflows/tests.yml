name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run tests
        run: pytest -q

      - name: Lint
        run: ruff check src tests

      # The core tool must keep working with no third-party packages present.
      # The [ask] extra is deliberately optional, so importing without it and
      # running a redaction is a real regression check, not a formality.
      - name: Verify zero-dependency core
        run: |
          python - <<'PY'
          import importlib.util
          for name in ("anthropic", "openai"):
              assert importlib.util.find_spec(name) is None, f"{name} unexpectedly installed"
          from decon import sanitize, desanitize
          clean, mapping = sanitize("host dc01.corp.local", use_config=False)
          assert "dc01.corp.local" not in clean, clean
          assert desanitize(clean, mapping) == "host dc01.corp.local"
          print("core works with stdlib only")
          PY

  provider-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Exercise the oldest SDK versions declared compatible in pyproject.toml.
      # This catches provider code that starts using an API newer than our floor.
      - name: Install provider dependency floors
        run: |
          pip install pytest ruff anthropic==0.116.0 openai==1.66.0
          pip install -e . --no-deps

      - name: Verify provider SDK contracts
        run: |
          python - <<'PY'
          import inspect
          import anthropic
          import openai

          claude = anthropic.Anthropic(api_key="test")
          assert "fallbacks" in inspect.signature(claude.beta.messages.stream).parameters

          client = openai.OpenAI(api_key="test")
          assert hasattr(client, "responses")
          assert "store" in inspect.signature(client.responses.create).parameters
          print("provider SDK floors expose the APIs DECON uses")
          PY

      - name: Run provider tests
        run: pytest -q tests/test_ask.py tests/test_api.py

  hook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      # The pre-commit entry must fail on data that needs redaction and pass on
      # data that does not; a hook that never fails is worse than no hook.
      - name: Hook fails on unredacted data
        run: |
          if decon --check --no-audit "tests/fixtures/emberglass/02 - AD Enumeration.md"; then
            echo "::error::--check passed on a file containing sensitive data"
            exit 1
          fi

      - name: Hook passes on clean data
        run: |
          printf '# Notes\n\nNothing sensitive here.\n' > clean.md
          decon --check --no-audit clean.md
