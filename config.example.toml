default_profile = "standard"

[rules]
# Toggle built-in rules on/off globally.
# all = false        # disable every built-in rule; per-rule keys override it
# ipv4 = true
# email = true
# mac = false
# private_key = true
# ntlm_hash = true
# ad_domain_user = true
# unc_path = true

[llm]
enabled = false
required = false                     # fail closed if review fails or leaks remain
model = "qwen3.5:9b"
host = "http://localhost:11434"
allow_remote = false                 # raw PII candidates stay on this Mac

[audit]
enabled = true
detail = "metadata"                  # metadata | full
# path = "~/engagement-audit.jsonl"  # default: ~/.local/state/decon/audit.jsonl

[ask]
provider = "claude"                  # claude | openai | ollama | codex | claude-code
host = "http://localhost:11434"      # ollama only
max_tokens = 16000
warn_chars = 50000                   # warn above this input size; 0 disables

# Codex and Claude Code run in an empty temporary directory by default and do
# not persist sessions. Standard mode loads normal CLI/project context; use it
# only in a trusted directory because that context is outside DECON's redaction.
[ask.cli]
mode = "isolated"                    # isolated | standard
timeout_seconds = 600

# Models are keyed by provider so --provider never sends a name to the wrong one
[ask.models]
claude = "claude-opus-5"
openai = "gpt-5"
ollama = "qwen3.5:9b"
# codex = "gpt-5.6-sol"              # omit to use the CLI default
# claude-code = "sonnet"             # omit to use the CLI default

[custom]
values = ["ACME Corp", "Project Nighthawk"]          # case-sensitive
values_nocase = ["jsmith", "proddb"]                 # case-insensitive, one placeholder across case variants
target_domains = ["contoso.com", "acmecorp.org"]     # case-insensitive bare domain + subdomains
allowlist = ["scanme.nmap.org"]                      # pass through unredacted

# Typed engagement identifiers. Regex catches common formats, but every
# engagement has its own naming conventions — a host called prod-web-01 slips
# past the generic hostname rules. Declaring identifiers here closes that gap
# while keeping their type: unlike `values`, these do NOT collapse into a
# generic [CUSTOM_REDACTED_] placeholder.
hostnames = ["DC01", "FILESERV01", "prod-web-01"]    # -> [HOST_SHORT_REDACTED_nnnn]
usernames = ["jsmith", "svc_backup"]                 # -> DOMAIN_USER_nn
netbios = ["ACME"]                                   # -> [DOMAIN_REDACTED_nnnn]
shares = ["SYSVOL", "NETLOGON", "HR-Data"]           # -> [SHARE_REDACTED_nnnn]

[[custom.patterns]]
# Must be valid TOML + valid Python regex; DECON reports config errors cleanly.
name = "internal_domains"
pattern = '[a-z0-9-]+\.corp\.acme\.com'
replacement = "[CUSTOM_HOST_REDACTED_{n:04d}]"

[profiles.client-share]
hostname_internal = true
# custom_values_extra = ["Nighthawk"]

[profiles.internal]
ipv4 = false
mac = false

[profiles.ctf]
# Lab infrastructure is public — redact nothing built-in. Values under [custom]
# still apply, so your own identifiers stay protected.
all = false

# `--profile pentest` is built in and enables standalone NT-hash detection.
