[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decon"
version = "0.8.0"
description = "Sanitize operational data before sharing. Consistent placeholders preserve analytical value."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
keywords = ["redaction", "sanitization", "pentest", "security", "privacy", "pii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Utilities",
]

[project.scripts]
decon = "decon.cli:main"

[project.urls]
Homepage = "https://github.com/BLTSEC/DECON"
Repository = "https://github.com/BLTSEC/DECON"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.12"]
# API providers for --ask. Kept optional so the core tool stays dependency-free;
# Ollama, Codex CLI, and Claude Code need nothing beyond the stdlib.
ask = ["anthropic>=0.116", "openai>=1.66"]

[tool.hatch.build.targets.wheel]
packages = ["src/decon"]

[tool.hatch.build]
# Defense in depth: local agent settings can be ignored globally rather than
# by this repository, but must never enter a source distribution.
exclude = ["/.claude", "/.codex", "/.agents", "/*.local.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
